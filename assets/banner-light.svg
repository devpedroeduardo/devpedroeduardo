    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#0f7d77" opacity="0.22"/></pattern>
  </defs>
  <rect width="1280" height="400" rx="18" fill="url(#g)"/>
  <rect x="0" y="0" width="560" height="400" fill="url(#dots)" opacity="0.6" rx="18"/>
  <rect x="64" y="96" width="6" height="150" rx="3" fill="#0f7d77"/>
  <text x="92" y="128" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="18" fill="#0f7d77" letter-spacing="2">OLÁ, EU SOU</text>
  <text x="90" y="188" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#1f2328">Pedro Eduardo</text>
