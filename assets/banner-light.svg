    <line x1="712" y1="112" x2="1216" y2="112" stroke="#d0d7de"/>
    <text x="742" y="150" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="17" xml:space="preserve"><tspan fill="#cf222e">const </tspan><tspan fill="#1f2328">pedro</tspan><tspan fill="#57606a"> = {</tspan></text><text x="742" y="177" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="17" xml:space="preserve"><tspan fill="#8250df">  cargo</tspan><tspan fill="#57606a">: </tspan><tspan fill="#0a3069">"Desenvolvedor Full-Stack"</tspan><tspan fill="#57606a">,</tspan></text><text x="742" y="204" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="17" xml:space="preserve"><tspan fill="#8250df">  stack</tspan><tspan fill="#57606a">: [</tspan><tspan fill="#0a3069">"React"</tspan><tspan fill="#57606a">, </tspan><tspan fill="#0a3069">"Next.js"</tspan><tspan fill="#57606a">, </tspan><tspan fill="#0a3069">"Node.js"</tspan><tspan fill="#57606a">],</tspan></text><text x="742" y="231" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="17" xml:space="preserve"><tspan fill="#8250df">  dados</tspan><tspan fill="#57606a">: [</tspan><tspan fill="#0a3069">"Oracle"</tspan><tspan fill="#57606a">, </tspan><tspan fill="#0a3069">"MySQL"</tspan><tspan fill="#57606a">, </tspan><tspan fill="#0a3069">"Supabase"</tspan><tspan fill="#57606a">],</tspan></text><text x="742" y="258" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="17" xml:space="preserve"><tspan fill="#8250df">  testes</tspan><tspan fill="#57606a">: [</tspan><tspan fill="#0a3069">"Playwright"</tspan><tspan fill="#57606a">, </tspan><tspan fill="#0a3069">"Jest"</tspan><tspan fill="#57606a">],</tspan></text><text x="742" y="285" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="17" xml:space="preserve"><tspan fill="#8250df">  base</tspan><tspan fill="#57606a">: </tspan><tspan fill="#0a3069">"Sobral-CE, Brasil"</tspan><tspan fill="#57606a">,</tspan></text><text x="742" y="312" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="17" xml:space="preserve"><tspan fill="#57606a">};</tspan></text><text x="742" y="339" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="17" xml:space="preserve"><tspan fill="#6e7781">// aberto a vagas e projetos freelance</tspan></text>
    <rect x="768" y="297" width="10" height="20" fill="#0f7d77"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
