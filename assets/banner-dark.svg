    <text x="742" y="150" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="17" xml:space="preserve"><tspan fill="#ff7b72">const </tspan><tspan fill="#e6edf3">pedro</tspan><tspan fill="#8b949e"> = {</tspan></text><text x="742" y="177" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="17" xml:space="preserve"><tspan fill="#d2a8ff">  cargo</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#a5d6ff">"Desenvolvedor Full-Stack"</tspan><tspan fill="#8b949e">,</tspan></text><text x="742" y="204" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="17" xml:space="preserve"><tspan fill="#d2a8ff">  stack</tspan><tspan fill="#8b949e">: [</tspan><tspan fill="#a5d6ff">"React"</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#a5d6ff">"Next.js"</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#a5d6ff">"Node.js"</tspan><tspan fill="#8b949e">],</tspan></text><text x="742" y="231" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="17" xml:space="preserve"><tspan fill="#d2a8ff">  dados</tspan><tspan fill="#8b949e">: [</tspan><tspan fill="#a5d6ff">"Oracle"</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#a5d6ff">"MySQL"</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#a5d6ff">"Supabase"</tspan><tspan fill="#8b949e">],</tspan></text><text x="742" y="258" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="17" xml:space="preserve"><tspan fill="#d2a8ff">  testes</tspan><tspan fill="#8b949e">: [</tspan><tspan fill="#a5d6ff">"Playwright"</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#a5d6ff">"Jest"</tspan><tspan fill="#8b949e">],</tspan></text><text x="742" y="285" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="17" xml:space="preserve"><tspan fill="#d2a8ff">  base</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#a5d6ff">"Sobral-CE, Brasil"</tspan><tspan fill="#8b949e">,</tspan></text><text x="742" y="312" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="17" xml:space="preserve"><tspan fill="#8b949e">};</tspan></text><text x="742" y="339" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="17" xml:space="preserve"><tspan fill="#6e7681">// aberto a vagas e projetos freelance</tspan></text>
    <rect x="768" y="297" width="10" height="20" fill="#38b2ac"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
